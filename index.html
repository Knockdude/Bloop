<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Faro</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
  <style>
    :root {
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --bg: #F3F6FB;
      --surface: #FFFFFF;
      --ink: #0E1A2E;
      --muted: #5A6A82;
      --line: #DCE3EF;
      --primary: #1F4FD8;
      --primary-ink: #FFFFFF;
      --beam: #FFB400;
      --chip: #E8EEFA;
      --shadow: 0 1px 2px rgba(14,26,46,.06), 0 8px 28px rgba(14,26,46,.08);
      --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
      --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0A1120; --surface: #121B30; --ink: #E8EEF9; --muted: #93A3BD; --line: #23304B;
        --primary: #7FA2FF; --primary-ink: #0A1120; --beam: #FFC53D; --chip: #1A2640;
        --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.35);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0A1120; --surface: #121B30; --ink: #E8EEF9; --muted: #93A3BD; --line: #23304B;
      --primary: #7FA2FF; --primary-ink: #0A1120; --beam: #FFC53D; --chip: #1A2640;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.35);
      color-scheme: dark;
    }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    body {
      margin: 0; padding: 0; font: 16px var(--body); line-height: 1.55;
      background: var(--bg); color: var(--ink);
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      min-height: 100vh;
    }
    img { max-width: 100%; }
    [hidden]:not([hidden=until-found i]) { display: none !important; }
    button, input { font: inherit; color: inherit; }
    a { color: var(--primary); }
    :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 8px; }

    .logo { display: inline-flex; align-items: center; gap: .5rem; font-family: var(--display); font-weight: 800; letter-spacing: -.02em; text-decoration: none; color: var(--ink); background: none; border: 0; cursor: pointer; padding: 0; }
    .logo svg { flex: none; }

    /* PORTADA */
    .home { min-height: 100vh; min-height: 100dvh; display: grid; align-content: center; justify-items: center; gap: 1.6rem; padding-block: 3rem; text-align: center; }
    .home .logo { font-size: clamp(3rem, 12vw, 5.5rem); gap: .7rem; }
    .home .logo svg { width: .9em; height: .9em; }
    .tagline { margin: -.6rem 0 0; color: var(--muted); max-width: 34ch; text-wrap: balance; }
    .sbox { width: min(100%, 680px); display: flex; align-items: center; gap: .5rem; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: .35rem .4rem .35rem 1.1rem; box-shadow: var(--shadow); }
    .sbox:focus-within { border-color: var(--primary); }
    .sbox input { flex: 1; min-width: 0; border: 0; background: transparent; outline: 0; font-size: 1.05rem; padding: .7rem 0; }
    .sbox input::placeholder { color: var(--muted); }
    .sbox .go { flex: none; border: 0; background: var(--primary); color: var(--primary-ink); font-weight: 600; border-radius: 999px; padding: .65rem 1.2rem; cursor: pointer; }
    .sbox .go:hover { filter: brightness(1.08); }
    .hint { color: var(--muted); font-size: .85rem; margin: 0; }
    kbd { font-family: var(--body); font-size: .78rem; background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: .05rem .4rem; }
    .chips { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; width: min(100%, 680px); }
    .chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: .4rem .9rem; cursor: pointer; font-size: .92rem; }
    .chip:hover { border-color: var(--primary); color: var(--primary); }
    .recent { width: min(100%, 680px); text-align: left; }
    .recent h2 { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 .4rem; font-weight: 600; }
    .recent ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .1rem; }
    .recent button { width: 100%; text-align: left; background: none; border: 0; padding: .4rem .5rem; border-radius: 8px; cursor: pointer; color: var(--ink); }
    .recent button:hover { background: var(--chip); }
    .recent .clear { width: auto; color: var(--muted); font-size: .82rem; margin-top: .3rem; }

    /* RESULTADOS */
    .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 1rem; padding-block: .8rem; border-bottom: 1px solid var(--line); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
    body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
    .top .logo { font-size: 1.5rem; }
    .top .sbox { flex: 1; width: auto; max-width: 720px; box-shadow: none; }
    .top .sbox input { padding: .5rem 0; }
    .top .sbox .go { padding: .45rem 1rem; }
    .page { width: min(100%, 780px); margin-inline: auto; padding-block: 1.4rem 4rem; display: grid; gap: 1.4rem; }
    .qline { margin: 0; color: var(--muted); font-size: .9rem; }
    .qline b { color: var(--ink); font-weight: 600; }

    .ai { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 1.2rem 1.3rem 1.1rem; min-width: 0; }
    .ai-head { display: flex; align-items: center; gap: .55rem; margin-bottom: .7rem; }
    .ai-head h2 { margin: 0; font-family: var(--display); font-size: 1rem; letter-spacing: -.01em; }
    .ai-head .pill { margin-left: auto; font-size: .72rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: .1rem .55rem; }
    .spark { width: 20px; height: 20px; flex: none; }
    .turn .ask { font-weight: 600; margin: 0 0 .5rem; }
    .md p { margin: .6rem 0; }
    .note { color: var(--muted); font-size: .8rem; margin: .8rem 0 0; }

    .sec h2 { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 .6rem; font-weight: 600; }
    .related { display: grid; gap: .4rem; }
    .related button { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: .65rem .9rem; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: .8rem; }
    .related button:hover { border-color: var(--primary); }
    .related button span { min-width: 0; overflow-wrap: anywhere; }
    .related svg { flex: none; color: var(--muted); }
    .engines { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: .6rem; }
    .engine { display: block; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: .75rem .95rem; color: var(--ink); min-width: 0; }
    .engine:hover { border-color: var(--primary); }
    .engine b { display: block; font-family: var(--display); }
    .engine small { color: var(--muted); overflow-wrap: anywhere; }
    .themebtn { margin-left: auto; background: none; border: 1px solid var(--line); border-radius: 999px; padding: .3rem .7rem; cursor: pointer; color: var(--muted); font-size: .8rem; }
    .foot { text-align: center; color: var(--muted); font-size: .8rem; padding: 1rem 0 2rem; }

    @media (max-width: 560px) {
      .top { flex-wrap: wrap; gap: .5rem; }
      .top .logo span { display: none; }
      .ai { padding: 1rem; }
      .sbox .go { padding: .6rem 1rem; }
    }
  </style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 48 48">
    <path d="M24 24 L46 10 V38 Z" fill="var(--beam)" opacity=".55"/>
    <path d="M24 24 L2 10 V38 Z" fill="var(--beam)" opacity=".25"/>
    <circle cx="24" cy="24" r="9" fill="var(--primary)"/>
    <circle cx="24" cy="24" r="3.5" fill="var(--beam)"/>
  </symbol>
  <symbol id="spark" viewBox="0 0 24 24"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z" fill="var(--primary)"/></symbol>
  <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<main id="app"></main>

<script>
(function () {
  var app = document.getElementById("app");
  var HKEY = "faro.historial";
  var EXAMPLES = [
    "¿Cómo funciona un agujero negro?",
    "Receta de pan de masa madre",
    "Diferencia entre HTTP y HTTPS",
    "Qué ver en Valparaíso en un día",
    "Cómo aprender a programar desde cero",
    "¿Qué es la inflación?"
  ];
  var state = { view: "home", q: "", related: [] };

  function loadHist() { try { return JSON.parse(localStorage.getItem(HKEY) || "[]").slice(0, 8); } catch (e) { return []; } }
  function saveHist(q) {
    try {
      var h = loadHist().filter(function (x) { return x.toLowerCase() !== q.toLowerCase(); });
      h.unshift(q); localStorage.setItem(HKEY, JSON.stringify(h.slice(0, 8)));
    } catch (e) {}
  }
  function clearHist() { try { localStorage.removeItem(HKEY); } catch (e) {} }

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  function search(q) {
    q = (q || "").trim(); if (!q) return;
    saveHist(q);
    state.view = "results";
    state.q = q;
    state.related = [
      "Noticias sobre " + q,
      "Definición y concepto de " + q,
      "Guías y tutoriales relacionados"
    ];
    renderResults();
    window.scrollTo(0, 0);
  }

  function goHome() { state.view = "home"; renderHome(); }

  function sbox(id, value) {
    return '<form class="sbox" id="' + id + '" role="search">' +
      '<input id="' + id + '-in" type="search" autocomplete="off" enterkeyhint="search" aria-label="Buscar" placeholder="Busca una consulta en la web..." value="' + esc(value) + '">' +
      '<button class="go" type="submit">Buscar</button></form>';
  }

  function bindBox(id) {
    var f = document.getElementById(id), inp = document.getElementById(id + "-in");
    f.addEventListener("submit", function (e) { e.preventDefault(); search(inp.value); });
    return inp;
  }

  function renderHome() {
    var h = loadHist();
    app.innerHTML =
      '<section class="home">' +
      '<div class="logo"><svg><use href="#mark"/></svg><span>Faro</span></div>' +
      '<p class="tagline">Acceso directo y rápido a tus buscadores web favoritos.</p>' +
      sbox("hbox", "") +
      '<p class="hint">Atajo: presiona <kbd>/</kbd> para escribir</p>' +
      '<div class="chips">' + EXAMPLES.map(function (x) { return '<button class="chip" data-q="' + esc(x) + '">' + esc(x) + "</button>"; }).join("") + "</div>" +
      (h.length ? '<div class="recent"><h2>Búsquedas recientes</h2><ul>' + h.map(function (x) { return '<li><button data-q="' + esc(x) + '">' + esc(x) + "</button></li>"; }).join("") + '</ul><button class="clear" id="clr">Borrar historial</button></div>' : "") +
      '<button class="themebtn" id="theme" style="margin:0">Cambiar tema</button>' +
      "</section>";
    var inp = bindBox("hbox"); inp.focus();
    app.querySelectorAll("[data-q]").forEach(function (b) { b.addEventListener("click", function () { search(b.getAttribute("data-q")); }); });
    var c = document.getElementById("clr"); if (c) c.addEventListener("click", function () { clearHist(); renderHome(); });
    bindTheme();
  }

  function renderResults() {
    var q = state.q, enc = encodeURIComponent(q);
    var engines = [
      ["Google", "https://www.google.com/search?q=" + enc],
      ["DuckDuckGo", "https://duckduckgo.com/?q=" + enc],
      ["Bing", "https://www.bing.com/search?q=" + enc],
      ["Wikipedia", "https://es.wikipedia.org/w/index.php?search=" + enc],
      ["YouTube", "https://www.youtube.com/results?search_query=" + enc],
      ["Google Maps", "https://www.google.com/maps/search/" + enc]
    ];

    app.innerHTML =
      '<header class="top"><button class="logo" id="home" aria-label="Ir al inicio"><svg width="30" height="30"><use href="#mark"/></svg><span>Faro</span></button>' +
      sbox("tbox", q) + "</header>" +
      '<div class="page">' +
      '<p class="qline">Búsqueda para <b>' + esc(q) + "</b></p>" +
      '<section class="ai" aria-live="polite"><div class="ai-head"><svg class="spark"><use href="#spark"/></svg><h2>Buscador Web Directo</h2><span class="pill">Modo Estático</span></div>' +
      '<div class="turn"><p class="md">Haz clic en cualquiera de los motores de búsqueda de abajo para consultar los resultados en vivo para <b>' + esc(q) + '</b>.</p></div>' +
      '<p class="note">Selecciona tu servicio preferido para abrir los resultados en una pestaña nueva.</p></section>' +
      (state.related.length ? '<section class="sec"><h2>Sugerencias de búsqueda</h2><div class="related">' + state.related.map(function (r) { return '<button data-rel="' + esc(r) + '"><span>' + esc(r) + '</span><svg width="18" height="18"><use href="#arrow"/></svg></button>'; }).join("") + "</div></section>" : "") +
      '<section class="sec"><h2>Ver resultados en la web</h2><div class="engines">' +
      engines.map(function (e) { return '<a class="engine" href="' + esc(e[1]) + '" target="_blank" rel="noopener noreferrer"><b>' + e[0] + "</b><small>Buscar “" + esc(q) + "”</small></a>"; }).join("") +
      "</div></section>" +
      '<div class="foot"><button class="themebtn" id="theme" style="margin:0">Cambiar tema</button></div></div>';

    document.getElementById("home").addEventListener("click", goHome);
    bindBox("tbox");
    app.querySelectorAll("[data-rel]").forEach(function (b) { b.addEventListener("click", function () { search(b.getAttribute("data-rel")); }); });
    bindTheme();
  }

  function bindTheme() {
    var b = document.getElementById("theme"); if (!b) return;
    b.addEventListener("click", function () {
      var cur = document.documentElement.getAttribute("data-theme");
      var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
    });
  }

  document.addEventListener("keydown", function (e) {
    var tag = (document.activeElement && document.activeElement.tagName) || "";
    if (e.key === "/" && tag !== "INPUT") {
      var i = document.querySelector(".sbox input"); if (i) { e.preventDefault(); i.focus(); i.select(); }
    }
  });

  renderHome();
})();
</script>

</body>
</html>
